[ReportFilter]
; semicolon-separated file mask patterns applied to reported file paths (post-processing)
ExcludePathMasks=*\3rdParty\*;*\TMS-SmartSetUp\*;*\Statuspro\*;*\mecMeister\*;*\madCollection\*;*\Add-in Express\*

[PascalAnalyzer]
; Optional non-conflicting PALCMD args. DAK owns report format/root/name, parse scope, quiet mode, and thread count.
Args=

[PascalAnalyzerIgnore]
; Canonical PAL rule keys or verified native PAL codes. Empty by default.
Rules=

[AnalysisPolicy]
; PAL reports these installed source units by module name only.
ThirdPartyRoots=$(SystemDrive)\Program Files (x86)\madCollection\madBasic\Sources;$(SystemDrive)\Program Files (x86)\madCollection\madDisAsm\Sources;$(SystemDrive)\Program Files (x86)\madCollection\madExcept\Sources

[MadExcept]
; Optional override for madExceptPatch.exe (or its folder).
Path=

[Build]
; Optional default Delphi version used when command line omits --delphi (for example: dfm-check)
DelphiVersion=
