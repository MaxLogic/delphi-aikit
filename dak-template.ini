; Copy this file to `dak.ini` for machine-local overrides.
; The workspace-root `dak.ini` is intentionally untracked and may contain absolute paths.

[Workspace]
; auto | git | svn | project | an existing fixed root path
Root=auto

[FixInsightCL]
; Path to FixInsightCL.exe or its containing folder.
Path=
; Optional output root for FixInsight reports.
Output=
; Optional semicolon-separated FixInsight rule IDs to ignore.
Ignore=
; Optional path to a FixInsight settings file.
Settings=
Silent=false
Xml=false
Csv=false
; External FixInsightCL process timeout in seconds. Omit/leave empty for the built-in default.
TimeoutSec=

[FixInsightIgnore]
; Semicolon-separated FixInsight rule IDs to suppress in report post-processing.
Warnings=

[PascalAnalyzerIgnore]
; Canonical PAL rule keys or verified native PAL codes to suppress only from actionable reports.
Rules=

[ReportFilter]
; Semicolon-separated Windows-style file mask patterns for report post-processing.
ExcludePathMasks=

[PascalAnalyzer]
; Path to PALCMD.EXE / PALCMD32.EXE or its containing folder.
Path=
; Optional report root folder passed as /R=...
Output=
; Optional extra PALCMD args passed verbatim.
Args=
; Explicit PAL /X list. Use absolute folders; add <+> to include subfolders.
ExcludeSearchFolders=
; Explicit PAL /XF list of files.
ExcludeFiles=
; External PALCMD process timeout in seconds. Omit/leave empty for the built-in default.
TimeoutSec=

[MadExcept]
; Path to madExceptPatch.exe or its containing folder.
Path=

[Build]
; Optional default Delphi version used when --delphi is omitted.
DelphiVersion=

[AnalysisPolicy]
; Ownership categories checked by DAK_GATE/DAK_CI. Valid values are project, repository, and third_party.
GateOwnership=project;repository
; Optional canonical PAL rule identities that make advisory metrics actionable.
GateMetrics=
; Optional roots used only to resolve otherwise unknown paths. Automatic project/VCS topology remains authoritative.
ProjectRoots=
ThirdPartyRoots=

[Diagnostics]
; Bounded source snippets for build/dfm-check failures.
; SourceContext = auto | off | on
; SourceContextLines = lines shown before/after the hit.
SourceContext=auto
SourceContextLines=2
; Existing controls for accepted project macros and optional missing paths.
IgnoreUnknownMacros=
IgnoreMissingPaths=

[WebCore]
; Path to TMSWebCompiler.exe.
CompilerPath=
